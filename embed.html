<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Embeddable interactive visualization of Human Existence Potential (HEP) for different temperature and precipitation preferences.">
  <meta name="theme-color" content="#f5f8f9">
  <title>Human Existence Potential · Interactive map</title>
  <link rel="icon" href="assets/hescor_logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body class="embedded">
  <main class="page">
    <h1 class="visually-hidden">Interactive Human Existence Potential map</h1>
    <section class="explorer" aria-labelledby="explorer-title">
      <div class="controls-card">
        <div class="section-heading">
          <p class="step">Your selection</p>
          <h2 id="explorer-title">Set climate preferences</h2>
          <p>Choose a preferred level for both climate factors. The map updates instantly.</p>
        </div>

        <fieldset class="choice-group" data-variable="temp">
          <legend><span class="factor-icon temp-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 14.76V5a4 4 0 0 0-8 0v9.76a6 6 0 1 0 8 0ZM8 5a2 2 0 0 1 4 0v10.85l.5.29a4 4 0 1 1-5 0l.5-.29V5Zm1 3h2v8.17a2.5 2.5 0 1 1-2 0V8Z"/></svg></span> Temperature</legend>
          <div class="segmented">
            <button type="button" data-value="low" aria-pressed="false">Low</button>
            <button type="button" data-value="mid" aria-pressed="true">Medium</button>
            <button type="button" data-value="high" aria-pressed="false">High</button>
          </div>
        </fieldset>

        <fieldset class="choice-group" data-variable="precip">
          <legend><span class="factor-icon precip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.2 6.8 8.53a8.32 8.32 0 0 0-2.05 5.3 7.25 7.25 0 0 0 14.5 0 8.32 8.32 0 0 0-2.05-5.3L12 2.2Zm0 17.05a5.42 5.42 0 0 1-5.25-5.42 6.4 6.4 0 0 1 1.6-4.03L12 5.36l3.65 4.44a6.4 6.4 0 0 1 1.6 4.03A5.42 5.42 0 0 1 12 19.25Z"/></svg></span> Precipitation</legend>
          <div class="segmented">
            <button type="button" data-value="low" aria-pressed="false">Low</button>
            <button type="button" data-value="mid" aria-pressed="true">Medium</button>
            <button type="button" data-value="high" aria-pressed="false">High</button>
          </div>
        </fieldset>
      </div>

      <figure class="map-card" aria-labelledby="map-title">
        <div class="map-heading">
          <div>
            <p class="step">Human Existence Potential</p>
            <h2 id="map-title">Medium temperature · Medium precipitation</h2>
          </div>
        </div>
        <div class="image-wrap">
          <img id="hep-map" src="assets/plots/HEP_midTemp_midPrecip.webp" width="1480" height="1373" alt="HEP map for medium temperature and medium precipitation">
        </div>
      </figure>
    </section>
  </main>
</body>
</html>
